openapi: 3.1.0
info:
  title: HRM Attendance Service
  version: 1.0.0
  description: Private attendance records and workday summary API.
servers:
  - url: http://127.0.0.1:3003
security:
  - InternalServiceToken: []
paths:
  /health:
    get:
      operationId: attendanceServiceHealth
      security: []
      responses:
        '200': { description: Service is running }
  /internal/v1/attendance:
    get:
      operationId: listAttendance
      parameters:
        - { name: ids, in: query, schema: { type: string }, description: Comma-separated attendance record IDs }
        - { name: employee_ids, in: query, schema: { type: string }, description: Comma-separated employee IDs }
        - { name: employee_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Attendance rows matching the requested filters }
        '400': { description: Invalid filter or date range }
        '401': { description: Internal service token is missing or invalid }
    post:
      operationId: upsertAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceInput' }
      responses:
        '201': { description: Attendance saved }
        '400': { description: Invalid employee, date, time, or source }
        '401': { description: Internal service token is missing or invalid }
    delete:
      operationId: deleteAttendance
      parameters:
        - { name: employee_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Attendance row deleted if present }
        '400': { description: Invalid employee ID or date }
        '401': { description: Internal service token is missing or invalid }
  /internal/v1/attendance/by-date:
    get:
      operationId: getAttendanceByDate
      parameters:
        - { name: employee_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Attendance row or null when no row exists }
        '400': { description: Invalid employee ID or date }
        '401': { description: Internal service token is missing or invalid }
  /internal/v1/attendance/exists:
    get:
      operationId: hasEmployeeAttendance
      parameters:
        - { name: employee_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Whether any attendance row exists for the employee }
        '401': { description: Internal service token is missing or invalid }
  /internal/v1/attendance/import:
    post:
      operationId: importAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  maxItems: 5000
                  items: { $ref: '#/components/schemas/AttendanceInput' }
      responses:
        '201': { description: Import completed transactionally }
        '400': { description: Invalid attendance batch }
        '401': { description: Internal service token is missing or invalid }
  /internal/v1/summary/batch:
    post:
      operationId: summarizeAttendanceBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, employees]
              properties:
                month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                employees:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: integer, minimum: 1 }
                      start_date: { type: string, format: date }
      responses:
        '201': { description: Summary and daily details for each employee }
        '400': { description: Invalid summary batch }
        '401': { description: Internal service token is missing or invalid }
        '503': { description: Config Service or Leave Service is unavailable }
  /internal/v1/migrate:
    post:
      operationId: migrateLegacyAttendance
      description: Idempotently imports legacy rows in batches of at most 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  maxItems: 500
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/AttendanceInput' }
                      - type: object
                        required: [id]
                        properties:
                          id: { type: integer, minimum: 1 }
      responses:
        '201': { description: Legacy rows imported }
        '400': { description: Invalid migration batch }
        '401': { description: Internal service token is missing or invalid }
components:
  securitySchemes:
    InternalServiceToken:
      type: apiKey
      in: header
      name: X-Internal-Service-Token
  schemas:
    AttendanceInput:
      type: object
      required: [employee_id, date]
      properties:
        id: { type: integer, minimum: 1 }
        employee_id: { type: integer, minimum: 1 }
        date: { type: string, format: date }
        check_in: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        check_out: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        note: { type: string, maxLength: 200 }
        source: { type: string, enum: [web, manual, import] }
